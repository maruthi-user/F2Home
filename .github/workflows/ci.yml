name: F2Home CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/f2home/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend/f2home
        run: npm ci

      - name: Build Frontend
        working-directory: frontend/f2home
        run: npm run build


  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build Spring Boot Backend
        working-directory: backend
        run: mvn clean package -DskipTests


  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Build Successful
        run: |
          echo "======================================"
          echo "F2Home CI completed successfully"
          echo "Frontend build: SUCCESS"
          echo "Backend build: SUCCESS"
          echo "======================================"
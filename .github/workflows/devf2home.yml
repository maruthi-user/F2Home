name: Deploy Dev F2Home (GitHub Pages - Free, No Droplet)

# Free DEV hosting: builds the React frontend and publishes it to GitHub
# Pages at https://<owner>.github.io/<repo>/ (e.g.
# https://maruthi-user.github.io/F2Home/). No secrets, no droplet, no cost.
#
# The Spring Boot backend cannot run on GitHub Pages (static hosting only).
# check-backend keeps compiling it on every push so breakage is caught early.
# When the cloud droplet/instance exists, devf2home-droplet.yml (manual
# trigger) takes over the full dev environment deployment.

on:
  push:
    branches: [ main ]
  # Re-deploy the current main without pushing (Actions tab -> Run workflow).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-dev
  cancel-in-progress: true

jobs:
  check-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Compile Spring Boot Backend
        working-directory: backend
        # Compile check only; run ./mvnw test locally for the full suite.
        run: mvn -B -q clean package -DskipTests

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/f2home/package-lock.json

      - name: Build React Frontend
        working-directory: frontend/f2home
        env:
          # GitHub Pages serves the site from /<repo>/, so every asset path
          # and both routers must be prefixed with the repo name.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - name: SPA Fallback + .nojekyll
        working-directory: frontend/f2home
        run: |
          # GitHub Pages only serves unknown paths through 404.html - use the
          # SPA entry so deep links (e.g. /F2Home/app/welcome) survive a hard
          # refresh instead of returning a raw 404.
          cp build/index.html build/404.html
          # Skip GitHub's Jekyll processing entirely (faster, and prevents
          # underscore-prefixed files from being dropped).
          touch build/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/f2home/build

  deploy-pages:
    needs: build-frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "DEV web app published to: ${{ steps.deployment.outputs.page_url }}"
          echo "Note: the backend is not hosted on GitHub Pages. API calls from"
          echo "the Pages site go to http://localhost:8081 (a backend running on"
          echo "the visitor's own machine) until the dev cloud instance exists."

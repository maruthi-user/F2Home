# ============================================================
# LOCAL PROFILE
# ============================================================

# Local web name is f2home.com. Add this line to your hosts file to reach
# the locally running site on that name:
#     127.0.0.1 f2home.com
# The API keeps running on this machine at http://localhost:8081.
app.url=http://localhost:8081
frontend.url=http://f2home.com

#Postgres (local instance)
spring.datasource.url=jdbc:postgresql://localhost:5432/F2Home
spring.datasource.username=postgres
spring.datasource.password=admin

# F2HOME JWT signing secret (Base64, 256-bit) - local-only value, distinct
# from dev/prod (which are supplied via .env, never committed - see
# .env.example). Safe to share since it only ever signs tokens on this
# machine's own local backend.
f2home.jwt.secret-key=HE7PwcYyQhOW07fNBoZzLOQRZoaD2PK4v6a4SJ2J/9U=

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

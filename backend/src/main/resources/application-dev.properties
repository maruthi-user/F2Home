# ============================================================
# DEV PROFILE
# ============================================================

app.url=https://api-dev.f2home.com
frontend.url=https://dev.f2home.com

#Postgres
# Real values (URL, username, password) come from a local, git-ignored .env
# file on the server - see .env.example. Never commit real credentials here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# F2HOME JWT signing secret (Base64, 256-bit) - also supplied via .env, never
# committed. Change for production (must differ from dev's value).
f2home.jwt.secret-key=${F2HOME_JWT_SECRET}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

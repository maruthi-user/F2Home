spring.application.name=f2home

# Optional local-only overrides.
# File is NOT committed (.gitignore) - absent on servers, so
# production keeps using the values below or deployment env vars.
spring.config.import=optional:file:.env[.properties]

# Active profile: local | dev | prod
# Override with -Dspring.profiles.active=prod or env var SPRING_PROFILES_ACTIVE=prod
# spring.profiles.active=dev
spring.profiles.active=local

server.port=8081
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

#Postgres (common)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
# Flyway owns the schema; Hibernate only validates the mapped entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

#Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# ============================================================
# F2HOME AUTH
# ============================================================
# Access-token lifetime (15 minutes). Refresh tokens live 30 days.
f2home.jwt.expiration-time=900000

# Flyway: owns the schema from the F2HOME auth phase onward.
# baseline-on-migrate accepts the pre-existing Hibernate-managed schema
# as-is; baseline-version=0 makes sure V1 still runs on baselined DBs.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.cache.disabled=true

# Keep format for LocalDate
spring.mvc.format.date=dd-MM-yyyy
spring.mvc.format.date-time=dd-MM-yyyy HH:mm:ss
spring.jackson.date-format=dd-MM-yyyy HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
